<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Project Epsilon 3{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='theme_epsilon.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="alpine-navbar">
        <div style="max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap;">
            <a href="/" class="alpine-brand">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M12 2L2 22h20L12 2z" fill="#f59e0b" opacity="0.9"/>
                    <path d="M12 8l-4 8h8l-4-8z" fill="#090e17"/>
                </svg>
                Epsilon <span>3</span>
            </a>
            <div style="display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;">
                {% block nav_links %}{% endblock %}
                {% if session.get('username') %}
                    <span class="text-slate" style="font-size: 0.9rem; padding: 0 0.5rem;">{{ session.username }}</span>
                    <a href="/portal/logout" class="nav-link-custom nav-link-logout">Logout</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main style="max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; flex: 1; width: 100%;">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
